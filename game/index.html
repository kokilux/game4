<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>KA — 夜の蚊取り</title>
    <style>
      :root {
        --ink: #e6e2ff;
        --dim: #8b85b0;
        --bg: #07060c; /* ゲームの闇と同じ色（額縁を消す） */
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "SFMono-Regular", Menlo, "Hiragino Kaku Gothic ProN", Meiryo, monospace;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      /* ゲーム画面だけ。枠・角丸・影は無し（画面全体＝ゲーム画面） */
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        cursor: none;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: var(--bg);
        cursor: none;
        touch-action: none;
      }
      #fatal {
        position: fixed;
        left: 12px; right: 12px; bottom: 12px;
        padding: 10px 12px;
        background: #2a0f18;
        border: 1px solid #7d1a2b;
        border-radius: 6px;
        color: #ffc9d2;
        font-size: 12px;
        line-height: 1.6;
        z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-phase="title">
      <canvas id="screen" width="320" height="180"></canvas>
    </div>
    <div id="fatal" hidden></div>
    <script>
      // 何か失敗したら黙って死なない：必ず画面に出す
      window.__KA_ERRORS = [];
      function kaFail(msg) {
        window.__KA_ERRORS.push(msg);
        var el = document.getElementById("fatal");
        if (!el) return;
        el.hidden = false;
        el.textContent = "読み込みエラー: " + msg;
      }
      window.addEventListener("error", function (e) {
        kaFail((e.message || "unknown error") + (e.filename ? " @ " + e.filename.split("/").pop() : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        kaFail(String((e.reason && e.reason.message) || e.reason));
      });
      // モジュールが動き出さなかった場合の番犬
      setTimeout(function () {
        if (!window.__KA_BOOTED) kaFail("main.js が起動しませんでした（サーバのパス設定か、ブラウザのキャッシュを確認）");
      }, 2500);
    </script>
    <script type="module" src="/game/src/main.js"></script>
  </body>
</html>
